name: Sync Announcements (beta)

# Раз в день (когда включим schedule ниже) тянет текущий "спринт" из беты MGG
# и перегенерирует src/data/announcements.json. Пока намеренно только
# workflow_dispatch - раскомментировать schedule, когда дизайн/данные обкатаны
# на preview и можно доверить прогон без присмотра.
on:
  # schedule:
  #   - cron: '15 14 * * *'  # 17:15 МСК (14:15 UTC), в стороне от sync-cron (13:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-announcements
  cancel-in-progress: false

jobs:
  sync-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Установка зависимостей
        run: npm ci

      - name: 4. Запуск синка анонсов
        id: sync
        run: npx tsx scripts/sync-announcements.ts

      - name: 5. Проверка изменений
        id: check-changes
        run: |
          if git diff --quiet src/data/announcements.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Изменений не обнаружено"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Обнаружены изменения в announcements.json"
          fi

      - name: 6. Сохранение изменений (Commit & Push)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && steps.check-changes.outputs.has_changes == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-Sync: обновление анонсов"
          commit_user_name: "MGG Parser Bot"
          commit_user_email: "bot@archivist-library.com"
          commit_author: "MGG Parser Bot <bot@archivist-library.com>"
          branch: ${{ github.ref_name }}
          file_pattern: 'src/data/announcements.json'

      - name: 7. Итоги работы
        if: always()
        run: |
          echo "## 📊 Итоги синхронизации анонсов" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ **Статус:** Обнаружены изменения, announcements.json обновлён" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Статус:** Изменений не обнаружено" >> $GITHUB_STEP_SUMMARY
          fi
          echo "🕐 **Время запуска:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
