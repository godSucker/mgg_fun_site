name: Site Health Check

# Внешние блэкбокс-мониторы (UptimeRobot и т.п.) ловят "сайт не отвечает" или
# "код не 200", но не ловят "отвечает 200, но контент пустой/сломанный" -
# например, если relay-сервер вернёт заглушку с кодом 200 вместо реальной
# страницы. Этот воркфлоу проверяет и код ответа, и наличие ожидаемого текста
# в самом HTML.
on:
  schedule:
    - cron: '0 */6 * * *' # каждые 6 часов
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода ответа и содержимого
        id: check
        run: |
          STATUS=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 15 https://archivist-library.com || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" != "200" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "reason=HTTP $STATUS вместо 200 (возможно, relay/Vercel Firewall/сертификат)" >> "$GITHUB_OUTPUT"
          elif ! grep -q "Archivist-Library" /tmp/body.html; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "reason=Код 200, но ожидаемый текст не найден в ответе (пустая/битая страница)" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Алерт в Telegram при провале
        if: steps.check.outputs.failed == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🔴 archivist-library.com: health check не прошёл — ${{ steps.check.outputs.reason }}"

      - name: Итог
        if: always()
        run: |
          echo "## 🩺 Site Health Check" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.failed }}" == "true" ]; then
            echo "🔴 **FAILED**: ${{ steps.check.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ OK (HTTP ${{ steps.check.outputs.status }})" >> "$GITHUB_STEP_SUMMARY"
          fi
