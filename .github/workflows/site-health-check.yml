name: Site Health Check

# Внешние блэкбокс-мониторы (UptimeRobot и т.п.) ловят "сайт не отвечает" или
# "код не 200", но не ловят "отвечает 200, но контент пустой/сломанный" -
# например, если relay-сервер вернёт заглушку с кодом 200 вместо реальной
# страницы. Этот воркфлоу проверяет и код ответа, и наличие ожидаемого текста
# в самом HTML.
on:
  schedule:
    - cron: '0 */6 * * *' # каждые 6 часов
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода ответа и содержимого
        id: check
        run: |
          STATUS=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 15 https://archivist-library.com || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          # github.event.schedule всегда равен строке cron из workflow (одна и та
          # же для всех 4 дневных прогонов), поэтому "какой именно это прогон"
          # определяем по текущему часу UTC, а не по event.schedule.
          if [ "$(date -u +%H)" = "00" ]; then
            echo "is_midnight=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_midnight=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$STATUS" != "200" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "reason=HTTP $STATUS вместо 200 (возможно, relay/Vercel Firewall/сертификат)" >> "$GITHUB_OUTPUT"
          elif ! grep -q "Archivist-Library" /tmp/body.html; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "reason=Код 200, но ожидаемый текст не найден в ответе (пустая/битая страница)" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Алерт в Telegram при провале
        if: steps.check.outputs.failed == 'true'
        run: |
          MSG=$(printf '[Health-Check]\n🔴 archivist-library.com: health check не прошёл — %s' "${{ steps.check.outputs.reason }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG"

      # "Тишина" от бота может означать и "всё ок", и "мониторинг сам сломался".
      # Раз в сутки (на прогоне в 00:00 UTC) шлём спокойный heartbeat независимо
      # от результата, чтобы не путать эти два случая.
      - name: Суточный heartbeat
        if: steps.check.outputs.failed == 'false' && steps.check.outputs.is_midnight == 'true'
        run: |
          MSG=$(printf '[Health-Check]\n✅ Heartbeat: мониторинг работает, сайт в порядке (HTTP %s)' "${{ steps.check.outputs.status }}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MSG"

      - name: Итог
        if: always()
        run: |
          echo "## 🩺 Site Health Check" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.failed }}" == "true" ]; then
            echo "🔴 **FAILED**: ${{ steps.check.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ OK (HTTP ${{ steps.check.outputs.status }})" >> "$GITHUB_STEP_SUMMARY"
          fi
